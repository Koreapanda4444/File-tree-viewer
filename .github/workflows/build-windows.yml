name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6.14,<7"

      - name: Check application startup
        run: python main.py --smoke-test

      - name: Build executable
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name FileTreeViewer
          --collect-submodules send2trash
          main.py

      - name: Verify executable startup and checksum
        shell: pwsh
        run: |
          $process = Start-Process -FilePath '.\dist\FileTreeViewer.exe' -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(60000)) {
            Stop-Process -Id $process.Id -Force
            throw 'Executable startup verification timed out'
          }
          if ($process.ExitCode -ne 0) { throw "Executable exited with $($process.ExitCode)" }
          $hash = (Get-FileHash 'dist/FileTreeViewer.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  FileTreeViewer.exe" | Set-Content 'dist/SHA256.txt' -Encoding ascii

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: FileTreeViewer-windows-x64
          path: |
            dist/FileTreeViewer.exe
            dist/SHA256.txt
          if-no-files-found: error
          retention-days: 14
