name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.14,<7" "ruff==0.16.6"

      - name: Verify source and data safety
        run: |
          ruff format --check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ruff check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_core.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_portable.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_gui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python main.py --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build portable application
        run: python scripts/build_windows.py

      - name: Verify executable and portable relocation
        run: python scripts/verify_windows.py dist/FileTreeViewer

      - name: Package ZIP and checksum
        run: python scripts/package_windows.py dist/FileTreeViewer

      - name: Verify extracted release ZIP
        shell: pwsh
        run: |
          $archive = (Get-ChildItem release/FileTreeViewer-*-windows-x64.zip).FullName
          python scripts/verify_windows.py $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload portable distribution
        uses: actions/upload-artifact@v7
        with:
          name: FileTreeViewer-windows-x64
          path: |
            release/FileTreeViewer-*-windows-x64.zip
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: >-
      github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release: publish 1.0.0')
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out verified source
        uses: actions/checkout@v7

      - name: Download verified distribution
        uses: actions/download-artifact@v7
        with:
          name: FileTreeViewer-windows-x64
          path: release

      - name: Publish first official release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "from version import __version__; print(__version__)"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read application version' }
          $tag = "v$version"
          $head = gh api "repos/$env:GITHUB_REPOSITORY/commits/main" --jq '.sha'
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:GITHUB_SHA) { throw 'main changed after this build; refusing release' }
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'This release already exists; refusing overwrite' }
          gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'This tag already exists; refusing overwrite' }
          $archive = (Get-ChildItem release/FileTreeViewer-*-windows-x64.zip).FullName
          gh release create $tag $archive release/SHA256SUMS --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "File Tree Viewer $version" --notes-file docs/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
