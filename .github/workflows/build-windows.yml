name: Build Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt ruff==0.16.6
      - run: ruff check .
      - run: python scripts/verify_enhancements.py
      - name: Build the existing portable application
        shell: cmd
        run: build_windows.bat
      - name: Verify packaged executable
        run: python scripts/verify_windows.py dist/FileTreeViewer
      - name: Package portable ZIP
        run: python scripts/package_windows.py dist/FileTreeViewer
      - name: Verify extracted ZIP
        shell: pwsh
        run: |
          $archive = (Get-ChildItem release/FileTreeViewer-*-windows-x64.zip).FullName
          python scripts/verify_windows.py $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: FileTreeViewer-windows-x64
          path: |
            release/FileTreeViewer-*-windows-x64.zip
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
