name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "ruff==0.16.6"

      - name: Check formatting
        run: ruff format --check main.py fs_paths.py fs_ops.py journal.py recovery.py file_operations.py file_preview.py file_content.py file_comparison.py file_metadata.py duplicate_management.py reports.py planning.py snapshot.py snapshot_store.py snapshot_compare.py plan_preview.py plan_dependencies.py organization.py persistence.py plan_diff.py conflicts.py plan_apply.py analysis.py diagnostics.py ui real virtual

      - name: Check code
        run: ruff check main.py fs_paths.py fs_ops.py journal.py recovery.py file_operations.py file_preview.py file_content.py file_comparison.py file_metadata.py duplicate_management.py reports.py planning.py snapshot.py snapshot_store.py snapshot_compare.py plan_preview.py plan_dependencies.py organization.py persistence.py plan_diff.py conflicts.py plan_apply.py analysis.py diagnostics.py ui real virtual

      - name: Check syntax
        run: python -m compileall -q main.py fs_paths.py fs_ops.py journal.py recovery.py file_operations.py file_preview.py file_content.py file_comparison.py file_metadata.py duplicate_management.py reports.py planning.py snapshot.py snapshot_store.py snapshot_compare.py plan_preview.py plan_dependencies.py organization.py persistence.py plan_diff.py conflicts.py plan_apply.py analysis.py diagnostics.py ui real virtual

      - name: Check imports
        run: python -c "import main, fs_paths, fs_ops, journal, recovery, file_operations, file_preview, file_content, file_comparison, file_metadata, duplicate_management, reports, planning, snapshot, snapshot_store, snapshot_compare, plan_preview, plan_dependencies, organization, persistence, plan_diff, conflicts, plan_apply, analysis, diagnostics, ui.analysis, ui.diagnostics, ui.batch, ui.plan_diff, ui.conflicts, ui.plan_apply, ui.performance, real.operations, real.preview, real.search, real.tree, ui.window, virtual.workspace"
