name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt ruff==0.16.6
      - run: ruff check .
      - run: python -m compileall -q -x '(^|[/\\])(\.git|\.venv|build|dist|release)([/\\]|$)' .
      - run: python scripts/verify_enhancements.py
